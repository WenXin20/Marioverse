 plugins {
    id 'java-library'
    id 'eclipse'
    id 'idea'
    id 'maven-publish'
    id 'net.neoforged.gradle.userdev' version '7.0.173'
}

version = minecraft_version + "-" + mod_version
group = mod_group_id
java.toolchain.languageVersion = JavaLanguageVersion.of(21)
minecraft.accessTransformers.file rootProject.file('src/main/resources/META-INF/accesstransformer.cfg')

base {
    archivesName = mod_id
}

repositories {
    maven {
        url "https://cursemaven.com"
        content { includeGroup "curse.maven" }
    }
    maven { url "https://maven.neoforged.net/releases" }
    maven { url = 'https://repo.spongepowered.org/repository/maven-public/' }
    mavenCentral()
    jcenter()
    flatDir {
        dir 'libs'
    }
}

configurations {
    runtimeClasspath.extendsFrom localRuntime
}

dependencies {
    implementation "net.neoforged:neoforge:${neo_version}"
    // compileOnly "org.spongepowered:mixin:0.8.5"

    // Imports
    // Dependencies
    implementation "curse.maven:accessories-${accessories_version}" // Required Dependency
    implementation "curse.maven:ctm-${ctm_version}" // Optional Dependency
    implementation "curse.maven:fusion-connected-textures-${fusion_version}" // Optional Dependency
    implementation "curse.maven:geckolib-${geckolib_version}" // Required Dependency

    implementation "curse.maven:create-328085:6641610"
    implementation "curse.maven:embeddium-${embeddium_version}"
    implementation "curse.maven:every-compat-${every_compat_version}" // Requires Moonlight
    implementation "curse.maven:gardens-of-the-dead-683174:5640395"
    implementation "curse.maven:inspectability-1312917:6805145"
    implementation "curse.maven:mmmmmmmmmmmm-${test_dummy_version}" // Requires Moonlight
    implementation "curse.maven:polytone-958094:6520025" // Requires Moonlight
    implementation "curse.maven:roughly-enough-items-${rei_version}"
    implementation "curse.maven:spark-${spark_version}"
    implementation "curse.maven:stone-zone-1154622:6710522" // Requires Moonlight
    implementation "curse.maven:supplementaries-${supplementaries_version}" // Requires Moonlight
    implementation "curse.maven:the-twilight-forest-227639:5699076"
    implementation "curse.maven:worldedit-225608:5830452"

    // Libraries
    implementation "curse.maven:architectury-api-${architectury_api_version}"
    implementation "curse.maven:cloth-config-${cloth_config_version}"
    implementation "curse.maven:owo-lib-${owo_version}"
    implementation "curse.maven:selene-${moonlight_version}"

    // implementation "curse.maven:simple-clouds-${simple_clouds_version}"

    // implementation "com.github.Virtuoel:Pehkui:${pehkui_version}"
    // implementation "software.bernie.geckolib:geckolib-neoforge-${minecraft_version}:${geckolib_version}"

    // implementation "curse.maven:itemzoom-261725:5536959"
    // implementation "curse.maven:jei-${jei_version}"
    // implementation "curse.maven:pehkui-${pehkui_version}"
    // implementation "curse.maven:structure-gel-api-${structure_gel_version}"
}


runs {
    configureEach {
        systemProperty 'forge.logging.markers', 'REGISTRIES'
        systemProperty 'forge.logging.console.level', 'debug'
        programArguments '-mixin.config=marioverse.mixins.json'

        modSource project.sourceSets.main
    }

    client {
        workingDirectory 'run'
        client true
        server false
        dataGenerator false
        gameTest false
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArguments.addAll '--username', 'WenXin2'
    }

    server {
        workingDirectory 'run'
        client false
        server true
        dataGenerator false
        gameTest false
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    gameTestServer {
        workingDirectory 'run'
        client false
        server false
        dataGenerator false
        gameTest true
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
    }

    data {
        workingDirectory 'run'
        client false
        server false
        dataGenerator true
        gameTest false
        systemProperty 'forge.enabledGameTestNamespaces', project.mod_id
        programArguments.addAll '--mod', 'marioverse', '--all', '--output',
                file('src/generated/resources/').getAbsolutePath(), '--existing', file('src/main/resources/').getAbsolutePath()
    }
}

// Include resources generated by data generators.
sourceSets.main.resources { srcDir 'src/generated/resources' }

println "Java: ${System.getProperty 'java.version'}, JVM: ${System.getProperty 'java.vm.version'} (${System.getProperty 'java.vendor'}), Arch: ${System.getProperty 'os.arch'}"

tasks.withType(ProcessResources).configureEach {
    var replaceProperties = [
            minecraft_version       : minecraft_version,
            minecraft_version_range : minecraft_version_range,
            neo_version             : neo_version,
            neo_version_range       : neo_version_range,
            loader_version_range    : loader_version_range,
            mod_id                  : mod_id,
            mod_name                : mod_name,
            mod_license             : mod_license,
            mod_version             : mod_version,
            mod_authors             : mod_authors,
            mod_description         : mod_description,
            mixin_configs           : mixin_location
    ]
    inputs.properties replaceProperties

    filesMatching(['META-INF/neoforge.mods.toml', '*.mixins.json']) {
        expand replaceProperties
    }
}

publishing {
    publications {
        register('mavenJava', MavenPublication) {
            from components.java
        }
    }

    repositories {
        maven {
            url "file://${project.projectDir}/repo"
        }
//        maven {
//            name = 'GeckoLib'
//            url 'https://dl.cloudsmith.io/public/geckolib3/geckolib/maven/'
//            content {
//                includeGroup("software.bernie.geckolib")
//            }
//        }
//        maven {
//            url = "https://jitpack.io"
//        }
    }
}

 tasks.withType(JavaCompile).configureEach {
     options.encoding = 'UTF-8' // Use the UTF-8 charset for Java compilation
 }

 tasks.withType(Copy).configureEach {
     duplicatesStrategy = DuplicatesStrategy.INCLUDE
 }

idea {
    module {
        downloadSources = true
        downloadJavadoc = true
    }
}
